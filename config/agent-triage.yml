# .github/workflows/agent-triage.yml
# Drop this into your Android repo.
# When an issue is opened, it auto-labels it 'claude' if it has the right format,
# OR lets you manually trigger the agent with /claude in a comment.

name: Agent Triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:

  # ── Auto-label new issues that follow the template ────────────
  auto-label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Label if agent-ready
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // Label issues that have a clear acceptance criteria section
            // (signals they're well-defined enough for the agent)
            const hasAcceptanceCriteria = 
              body.toLowerCase().includes('acceptance criteria') ||
              body.toLowerCase().includes('## expected') ||
              body.toLowerCase().includes('## steps');

            if (hasAcceptanceCriteria) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['claude']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '🤖 This issue has been queued for the Claude agent team. You\'ll receive a Telegram notification when work begins.'
              });
            }

  # ── Trigger agent manually via /claude comment ────────────────
  manual-trigger:
    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/claude')
    runs-on: ubuntu-latest
    steps:
      - name: Add claude label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const command = context.payload.comment.body.trim();

            // /claude           → trigger with default behavior  
            // /claude retry     → remove in-progress, re-trigger
            // /claude cancel    → remove labels

            if (command === '/claude cancel') {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              }).catch(() => {});
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'claude'
              }).catch(() => {});
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '⏹ Agent task cancelled.'
              });
              return;
            }

            if (command === '/claude retry') {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              }).catch(() => {});
            }

            // Add claude label to trigger the agent
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['claude']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '🤖 Queued for Claude agent team. Check your Telegram for updates.'
            });
