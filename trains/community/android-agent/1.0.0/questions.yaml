groups:
  - name: "Network Configuration"
    description: "Configure the status dashboard port. All other setup happens via the web UI after install."

portals:
  web_portal:
    protocols:
      - "http"
    host:
      - "0.0.0.0"
    ports:
      - "{{ .Values.network.dashboard_port }}"
    path: "/"

questions:

  - variable: agent
    label: "Agent Defaults"
    group: "Network Configuration"
    schema:
      type: dict
      attrs:
        - variable: developer_count
          label: "Initial Parallel Developer Agents"
          description: >-
            How many developer containers to start. You can change this
            later via the web setup page and restart the app. Default: 2.
          schema:
            type: int
            required: true
            default: 2
            enum:
              - value: 1
                description: "1 — minimal resources"
              - value: 2
                description: "2 — recommended"
              - value: 3
                description: "3 — heavy workload"
              - value: 4
                description: "4 — max parallel (requires 24GB+ RAM)"

  - variable: network
    label: "Network Configuration"
    group: "Network Configuration"
    schema:
      type: dict
      attrs:
        - variable: dashboard_port
          label: "Status Dashboard Port"
          description: >-
            Port to access the web dashboard. After install, open
            http://<your-nas>:PORT to complete setup (GitHub, Telegram,
            Anthropic credentials, etc).
          schema:
            type: int
            required: true
            default: 7842
            min: 1024
            max: 65535
