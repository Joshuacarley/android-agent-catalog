{#
  Android Agent Team — TrueNAS Catalog App
  Jinja2 template rendered by TrueNAS SCALE (Electric Eel+).

  Configuration flow:
    - The `dashboard` container boots immediately and serves a /setup
      page on the dashboard port. The user enters all their credentials
      through that web form.
    - Every other container waits for the dashboard to write
      /agent/config/config.json to the shared `agent-config` volume,
      then loads it and starts its role.

  No secrets are baked into this compose file — the only question the
  TrueNAS install wizard asks is the dashboard host port.
#}
{%- set image = images.image.repository ~ ":" ~ images.image.tag -%}
{%- set dev_count = values.agent.developer_count -%}
version: "3.9"

services:

  # ── Status Dashboard (boots first, hosts /setup) ─────────
  dashboard:
    image: {{ image }}
    container_name: agent-dashboard
    restart: always
    command: ["dashboard"]
    ports:
      - "{{ values.network.dashboard_port }}:7842"
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - agent-config:/agent/config
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Telegram Bot (always-on, two-way control) ────────────
  telegram-bot:
    image: {{ image }}
    container_name: agent-telegram-bot
    restart: always
    command: ["telegram-bot"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - agent-config:/agent/config
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bot.py"]
      interval: 30s
      retries: 3

  # ── Coordinator (polls GitHub, dispatches tasks) ─────────
  coordinator:
    image: {{ image }}
    container_name: agent-coordinator
    restart: unless-stopped
    command: ["coordinator"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config

  # ── Architect ────────────────────────────────────────────
  architect:
    image: {{ image }}
    container_name: agent-architect
    restart: unless-stopped
    command: ["worker", "architect"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config

  # ── Developer 1 ──────────────────────────────────────────
  developer-1:
    image: {{ image }}
    container_name: agent-developer-1
    restart: unless-stopped
    command: ["worker", "developer"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config
{% if dev_count >= 2 %}
  # ── Developer 2 ──────────────────────────────────────────
  developer-2:
    image: {{ image }}
    container_name: agent-developer-2
    restart: unless-stopped
    command: ["worker", "developer"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config
{% endif %}
{% if dev_count >= 3 %}
  # ── Developer 3 ──────────────────────────────────────────
  developer-3:
    image: {{ image }}
    container_name: agent-developer-3
    restart: unless-stopped
    command: ["worker", "developer"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config
{% endif %}
{% if dev_count >= 4 %}
  # ── Developer 4 ──────────────────────────────────────────
  developer-4:
    image: {{ image }}
    container_name: agent-developer-4
    restart: unless-stopped
    command: ["worker", "developer"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config
{% endif %}
  # ── QA (emulator, screen recording) ──────────────────────
  qa:
    image: {{ image }}
    container_name: agent-qa
    restart: unless-stopped
    command: ["worker", "qa"]
    environment:
      DISPLAY: ":99"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config

  # ── DevOps (final build, Telegram delivery, GitHub PR) ──
  devops:
    image: {{ image }}
    container_name: agent-devops
    restart: unless-stopped
    command: ["worker", "devops"]
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - bus:/agent/bus
      - workspaces:/agent/workspaces
      - logs:/agent/logs
      - builds:/builds
      - android-home:/root/.android
      - claude-credentials:/root/.claude
      - agent-config:/agent/config

volumes:
  bus:
  workspaces:
  logs:
  builds:
  android-home:
  claude-credentials:
  agent-config:
