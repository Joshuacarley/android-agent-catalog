version: "3.9"

# Android Agent Team — TrueNAS Catalog App
# Variables here are populated by the TrueNAS installation wizard (questions.yaml)

x-agent-base: &agent-base
  image: ghcr.io/Joshuacarley/android-agent:latest
  restart: unless-stopped
  environment:
    GITHUB_TOKEN: "${GITHUB_TOKEN}"
    GITHUB_REPO: "${GITHUB_REPO}"
    TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
    TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    CLAUDE_AUTH_MODE: "${CLAUDE_AUTH_MODE}"
    CLAUDE_ISSUE_LABEL: "${CLAUDE_ISSUE_LABEL}"
    POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS}"
    APP_PACKAGE: "${APP_PACKAGE}"
    TZ: "${TZ}"
  devices:
    - /dev/kvm:/dev/kvm
  volumes:
    - "${DATA_PATH}/bus:/agent/bus"
    - "${DATA_PATH}/workspaces:/agent/workspaces"
    - "${DATA_PATH}/logs:/agent/logs"
    - "${DATA_PATH}/builds:/builds"
    - "${DATA_PATH}/android-home:/root/.android"
    - "${DATA_PATH}/claude-credentials:/root/.claude"
    - "${DATA_PATH}/agent-config:/agent/config"

services:

  # ── Telegram Bot (always-on, two-way control) ─────────────
  telegram-bot:
    <<: *agent-base
    container_name: agent-telegram-bot
    command: ["telegram-bot"]
    restart: always
    volumes:
      - "${DATA_PATH}/bus:/agent/bus"
      - "${DATA_PATH}/workspaces:/agent/workspaces"
      - "${DATA_PATH}/logs:/agent/logs"
      - "${DATA_PATH}/builds:/builds"
      - "${DATA_PATH}/android-home:/root/.android"
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bot.py"]
      interval: 30s
      retries: 3

  # ── Status Dashboard ──────────────────────────────────────
  dashboard:
    <<: *agent-base
    container_name: agent-dashboard
    command: ["dashboard"]
    restart: always
    ports:
      - "${DASHBOARD_PORT}:7842"
    volumes:
      - "${DATA_PATH}/bus:/agent/bus:ro"
      - "${DATA_PATH}/workspaces:/agent/workspaces:ro"
      - "${DATA_PATH}/logs:/agent/logs:ro"
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── Coordinator (polls GitHub, dispatches tasks) ──────────
  coordinator:
    <<: *agent-base
    container_name: agent-coordinator
    command: ["coordinator"]

  # ── Architect ─────────────────────────────────────────────
  architect:
    <<: *agent-base
    container_name: agent-architect
    command: ["worker", "architect"]

  # ── Developer 1 ───────────────────────────────────────────
  developer-1:
    <<: *agent-base
    container_name: agent-developer-1
    command: ["worker", "developer"]

  # ── Developer 2 (disabled if DEVELOPER_COUNT < 2) ─────────
  developer-2:
    <<: *agent-base
    container_name: agent-developer-2
    command: ["worker", "developer"]
    profiles:
      - "dev2"   # enabled when DEVELOPER_COUNT >= 2

  # ── Developer 3 ───────────────────────────────────────────
  developer-3:
    <<: *agent-base
    container_name: agent-developer-3
    command: ["worker", "developer"]
    profiles:
      - "dev3"   # enabled when DEVELOPER_COUNT >= 3

  # ── Developer 4 ───────────────────────────────────────────
  developer-4:
    <<: *agent-base
    container_name: agent-developer-4
    command: ["worker", "developer"]
    profiles:
      - "dev4"   # enabled when DEVELOPER_COUNT >= 4

  # ── QA (emulator, screen recording) ──────────────────────
  qa:
    <<: *agent-base
    container_name: agent-qa
    command: ["worker", "qa"]
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_REPO: "${GITHUB_REPO}"
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      APP_PACKAGE: "${APP_PACKAGE}"
      TZ: "${TZ}"
      DISPLAY: ":99"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_ADMIN

  # ── DevOps (final build, Telegram delivery, GitHub PR) ────
  devops:
    <<: *agent-base
    container_name: agent-devops
    command: ["worker", "devops"]
