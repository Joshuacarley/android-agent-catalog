name: Make Package Public

# This runs once after the first successful image push
# to make the GHCR package publicly pullable (no auth needed for TrueNAS)

on:
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [main]

jobs:
  make-public:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Reminder — set package visibility manually
        run: |
          echo "::notice::The default GITHUB_TOKEN cannot change user-owned"
          echo "::notice::package visibility. To make the image anonymously"
          echo "::notice::pullable for TrueNAS, open:"
          echo "::notice::https://github.com/users/${{ github.repository_owner }}/packages/container/android-agent/settings"
          echo "::notice::and set visibility to Public (one-time)."
